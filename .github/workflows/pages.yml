name: 웹 미리보기 배포

# main 에 푸시할 때마다 www/ 를 GitHub Pages 로 올린다.
# 폰 브라우저에서 바로 카메라까지 동작한다 (https 라서 권한이 열림).

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 한 번 켜두어야 한다
      # (워크플로 토큰에는 Pages 를 새로 만들 권한이 없다)
      - uses: actions/configure-pages@v5

      - name: www 폴더 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: 배포
        id: deploy
        uses: actions/deploy-pages@v4
