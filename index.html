<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#08090B">
<title>LUME</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ═══════════════ 스플래시 ═══════════════ -->
<div id="splash">
  <div class="splash-mark">
    <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
      <circle cx="32" cy="32" r="20" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".5"/>
      <circle cx="32" cy="32" r="11" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="3.5" fill="currentColor"/>
    </svg>
    <div class="splash-name">LUME</div>
    <div class="splash-sub">프리셋 그대로, 실시간으로</div>
  </div>
</div>

<!-- ═══════════════ 카메라 화면 ═══════════════ -->
<main id="screen-camera" class="screen active">

  <div id="stage">
    <div id="frame">
      <canvas id="gl"></canvas>
      <video id="video" playsinline autoplay muted></video>
      <div id="grid" class="grid-off"></div>
      <div id="focusRing"></div>
      <div id="shutterFlash"></div>
      <div id="camError" class="cam-error hidden">
        <div class="cam-error-icon">◎</div>
        <p id="camErrorText">카메라를 사용할 수 없습니다</p>
        <button class="btn-ghost" id="btnRetryCam">다시 시도</button>
      </div>
    </div>
  </div>

  <!-- 상단 바 -->
  <header id="topbar">
    <button class="ic" id="btnLibrary" aria-label="프리셋 보관함">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
    </button>
    <div class="top-mid">
      <button class="pill" id="btnRatio">3:4</button>
      <button class="pill" id="btnGrid">격자</button>
      <button class="pill" id="btnTorch">플래시</button>
    </div>
    <button class="ic" id="btnSettings" aria-label="설정">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3L5.5 5.5"/></svg>
    </button>
  </header>

  <!-- 녹화 상태 -->
  <div id="recBar" class="hidden"><span class="rec-dot"></span><span id="recTime">00:00</span></div>

  <!-- 하단 컨트롤 -->
  <footer id="bottom">

    <div id="intensityWrap" class="hidden">
      <span class="int-label">강도</span>
      <input type="range" id="intensity" min="0" max="100" value="100">
      <span class="int-val" id="intensityVal">100</span>
    </div>

    <div id="presetStrip">
      <div id="presetRail"></div>
    </div>

    <div id="modeRow">
      <button class="mode active" data-mode="photo">사진</button>
      <button class="mode" data-mode="video">영상</button>
    </div>

    <div id="actionRow">
      <button id="btnThumb" class="thumb" aria-label="최근 촬영"><span class="thumb-empty"></span></button>
      <button id="btnShutter" aria-label="촬영"><span class="sh-inner"></span></button>
      <button id="btnFlip" class="ic big" aria-label="카메라 전환">
        <svg viewBox="0 0 24 24"><path d="M4 8.5A4.5 4.5 0 0 1 8.5 4H15"/><path d="M12.5 1.5 15.5 4l-3 2.5"/><path d="M20 15.5a4.5 4.5 0 0 1-4.5 4.5H9"/><path d="M11.5 22.5 8.5 20l3-2.5"/></svg>
      </button>
    </div>
  </footer>

  <!-- 프리셋 편집 진입 -->
  <button id="btnEdit" class="edit-fab" aria-label="프리셋 편집">
    <svg viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16z"/><path d="M14.5 5.5 18.5 9.5"/></svg>
    <span>편집</span>
  </button>
</main>

<!-- ═══════════════ 프리셋 편집 ═══════════════ -->
<section id="screen-editor" class="screen sheet">
  <header class="sheet-head">
    <button class="txtbtn" id="edCancel">취소</button>
    <div class="sheet-title"><span id="edName">프리셋</span><small id="edDirty" class="hidden">· 수정됨</small></div>
    <button class="txtbtn accent" id="edSave">저장</button>
  </header>

  <nav id="edTabs" class="tabs">
    <button class="tab active" data-tab="basic">기본</button>
    <button class="tab" data-tab="curve">커브</button>
    <button class="tab" data-tab="hsl">색상</button>
    <button class="tab" data-tab="grade">그레이딩</button>
    <button class="tab" data-tab="fx">효과</button>
  </nav>

  <div id="edBody">
    <div class="tabpane active" data-pane="basic"></div>

    <div class="tabpane" data-pane="curve">
      <div class="curve-chan">
        <button class="chan active" data-ch="rgb">RGB</button>
        <button class="chan r" data-ch="r">R</button>
        <button class="chan g" data-ch="g">G</button>
        <button class="chan b" data-ch="b">B</button>
      </div>
      <canvas id="curveCanvas" width="600" height="600"></canvas>
      <div class="curve-hint">점을 끌어 조절 · 빈 곳을 탭하면 점 추가 · 점을 길게 누르면 삭제</div>
      <button class="btn-ghost wide" id="curveReset">이 채널 초기화</button>
      <div class="param-group" data-group="param"></div>
    </div>

    <div class="tabpane" data-pane="hsl">
      <div class="hsl-mode">
        <button class="chan active" data-hsl="hue">색조</button>
        <button class="chan" data-hsl="sat">채도</button>
        <button class="chan" data-hsl="lum">휘도</button>
      </div>
      <div id="hslBody"></div>
    </div>

    <div class="tabpane" data-pane="grade">
      <div class="grade-zones">
        <button class="chan active" data-zone="mid">중간톤</button>
        <button class="chan" data-zone="shadow">어두운 영역</button>
        <button class="chan" data-zone="high">밝은 영역</button>
        <button class="chan" data-zone="global">전체</button>
      </div>
      <div class="wheel-wrap">
        <canvas id="wheel" width="440" height="440"></canvas>
        <div id="wheelDot"></div>
      </div>
      <div id="gradeSliders"></div>
    </div>

    <div class="tabpane" data-pane="fx"></div>
  </div>

  <div class="sheet-foot">
    <button class="btn-ghost" id="edReset">전체 초기화</button>
    <button class="btn-ghost" id="edExport">XMP 내보내기</button>
    <button class="btn-ghost" id="edSaveAs">새 프리셋으로</button>
  </div>
</section>

<!-- ═══════════════ 보관함 ═══════════════ -->
<section id="screen-library" class="screen sheet">
  <header class="sheet-head">
    <button class="txtbtn" id="libClose">닫기</button>
    <div class="sheet-title">프리셋 보관함</div>
    <button class="txtbtn accent" id="libImport">불러오기</button>
  </header>
  <nav class="tabs" id="libTabs">
    <button class="tab active" data-lib="mine">내 프리셋</button>
    <button class="tab" data-lib="store">커뮤니티</button>
  </nav>
  <div class="tabpane active" data-libpane="mine">
    <div id="libGrid" class="lib-grid"></div>
    <div class="lib-note">라이트룸 <b>.xmp</b> 프리셋 파일을 불러오면 색감이 그대로 카메라에 적용됩니다.<br>여러 개를 한 번에 선택할 수 있어요.</div>
  </div>
  <div class="tabpane" data-libpane="store">
    <div id="storeBody"></div>
  </div>
  <input type="file" id="fileXmp" accept=".xmp,.XMP,application/xml,text/xml" multiple hidden>
</section>

<!-- ═══════════════ 설정 ═══════════════ -->
<section id="screen-settings" class="screen sheet">
  <header class="sheet-head">
    <button class="txtbtn" id="setClose">닫기</button>
    <div class="sheet-title">설정</div>
    <span style="width:56px"></span>
  </header>
  <div id="setBody"></div>
</section>

<!-- ═══════════════ 촬영 결과 미리보기 ═══════════════ -->
<section id="screen-viewer" class="screen">
  <header class="sheet-head glass">
    <button class="txtbtn" id="vwClose">닫기</button>
    <div class="sheet-title" id="vwTitle">방금 찍은 사진</div>
    <button class="txtbtn accent" id="vwSave">저장·공유</button>
  </header>
  <div id="vwStage"></div>
</section>

<div id="toast"></div>

<script src="js/store.js"></script>
<script src="js/xmp.js"></script>
<script src="js/presets.js"></script>
<script src="js/gl.js"></script>
<script src="js/camera.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
