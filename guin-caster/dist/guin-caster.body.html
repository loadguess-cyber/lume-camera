<title>구인 캐스터</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* styles.css — 구인 캐스터
 * 밝은 곳에서 한 손으로 쓰는 도구입니다. 대비를 세게, 버튼을 크게 잡았습니다.
 */

:root {
  --bg:      #F6F7F9;
  --surface: #FFFFFF;
  --sunk:    #EFF1F4;
  --line:    #E1E5EA;
  --fg:      #14171C;
  --dim:     #667085;
  --faint:   #9AA3AF;
  --accent:  #1D6F42;
  --accent-soft: #E7F3EC;
  --on-accent: #FFFFFF;
  --warn:    #B4531B;
  --warn-soft:   #FCF0E6;
  --danger:  #C0392B;
  --radius:  14px;
  --tabh:    62px;
  --toph:    54px;
  --safe-b:  env(safe-area-inset-bottom, 0px);
  --safe-t:  env(safe-area-inset-top, 0px);
}

/* 어두운 테마.
 * 기기 설정을 따르되, 보는 사람이 직접 고른 쪽이 언제나 이깁니다.
 * — 기기가 어두워도 [밝게]로 고정했으면 :not() 이 걸러냅니다.
 * — 기기가 밝아도 [어둡게]로 고정했으면 아래 블록이 덮어씁니다.        */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:      #0E1013;
    --surface: #171A1F;
    --sunk:    #1F2329;
    --line:    #2A2F37;
    --fg:      #F1F3F5;
    --dim:     #9BA3AE;
    --faint:   #6B7280;
    --accent:  #6FCF97;
    --accent-soft: #16281E;
    --on-accent: #0E1013;
    --warn:    #E8A87C;
    --warn-soft:   #2A1F16;
    --danger:  #F07167;
  }
}

:root[data-theme="dark"] {
  --bg:      #0E1013;
  --surface: #171A1F;
  --sunk:    #1F2329;
  --line:    #2A2F37;
  --fg:      #F1F3F5;
  --dim:     #9BA3AE;
  --faint:   #6B7280;
  --accent:  #6FCF97;
  --accent-soft: #16281E;
  --on-accent: #0E1013;
  --warn:    #E8A87C;
  --warn-soft:   #2A1F16;
  --danger:  #F07167;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  font-size: 16px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}

button, input, textarea, select { font: inherit; color: inherit; }
input, textarea, select { -webkit-appearance: none; appearance: none; }
.hidden { display: none !important; }

/* ─────────── 상단 바 ─────────── */

#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 40;
  height: calc(var(--toph) + var(--safe-t));
  padding: var(--safe-t) 8px 0;
  display: flex; align-items: center; gap: 4px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--line);
}

#topTitle {
  flex: 1; margin: 0; padding-left: 8px;
  font-size: 18px; font-weight: 700; letter-spacing: -0.02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.icon-btn {
  width: 40px; height: 40px; flex: 0 0 auto;
  display: grid; place-items: center;
  background: none; border: 0; border-radius: 10px; cursor: pointer;
}
.icon-btn:active { background: var(--sunk); }

.txt-btn {
  flex: 0 0 auto; padding: 8px 12px;
  background: none; border: 0; border-radius: 10px; cursor: pointer;
  font-size: 15px; font-weight: 700; color: var(--accent);
}
.txt-btn:active { background: var(--sunk); }

/* ─────────── 본문 ─────────── */

#view {
  padding: calc(var(--toph) + var(--safe-t) + 12px) 16px calc(var(--tabh) + var(--safe-b) + 32px);
  max-width: 720px; margin: 0 auto;
  outline: none;
}

/* ─────────── 아래 탭 ─────────── */

#tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  height: calc(var(--tabh) + var(--safe-b));
  padding-bottom: var(--safe-b);
  display: flex;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-top: 1px solid var(--line);
}

.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; background: none; border: 0; cursor: pointer;
  color: var(--faint); font-size: 11px; font-weight: 600;
  position: relative;
}
.tab.active { color: var(--accent); }
.tab .badge {
  position: absolute; top: 7px; left: 50%; margin-left: 6px;
  min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: 9px; background: var(--danger); color: var(--on-accent);
  font-size: 10px; font-weight: 700; line-height: 17px; text-align: center;
}

/* ─────────── 카드 · 목록 ─────────── */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
}

.card.tap { cursor: pointer; transition: transform .08s; }
.card.tap:active { transform: scale(.985); }

.card-title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
.card-sub   { font-size: 13.5px; color: var(--dim); margin-top: 3px; }

.section-label {
  font-size: 12.5px; font-weight: 700; color: var(--faint);
  letter-spacing: .04em; text-transform: none;
  margin: 22px 2px 8px;
}
.section-label:first-child { margin-top: 4px; }

.empty {
  text-align: center; padding: 48px 20px; color: var(--dim);
}
.empty strong { display: block; font-size: 16px; color: var(--fg); margin-bottom: 6px; }
.empty p { margin: 0; font-size: 14px; line-height: 1.7; }

/* ─────────── 버튼 ─────────── */

.btn {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  width: 100%; min-height: 50px; padding: 12px 16px;
  background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: 12px;
  font-size: 15.5px; font-weight: 700; cursor: pointer;
  transition: transform .08s;
}
.btn:active { transform: scale(.985); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.ghost   { background: transparent; }
.btn.danger  { color: var(--danger); }
.btn.sm      { min-height: 40px; font-size: 14px; padding: 8px 12px; width: auto; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.btn-row { display: flex; gap: 8px; margin-top: 10px; }
.btn-row .btn { flex: 1; }

/* ─────────── 입력 ─────────── */

.field { margin-bottom: 14px; }
.field label {
  display: block; font-size: 13px; font-weight: 700;
  color: var(--dim); margin-bottom: 5px;
}
.field .hint { font-weight: 500; color: var(--faint); }

.input, .textarea, select.input {
  width: 100%; padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 11px; font-size: 16px; line-height: 1.5;
}
.input:focus, .textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.textarea { min-height: 92px; resize: vertical; }
.textarea.tall { min-height: 260px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }

select.input {
  background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
  background-position: calc(100% - 19px) 22px, calc(100% - 13px) 22px;
  background-size: 6px 6px; background-repeat: no-repeat;
}

/* ─────────── 배지 · 칩 ─────────── */

.badge-pill {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 700; white-space: nowrap;
}
.b-never { background: var(--sunk);        color: var(--dim); }
.b-due   { background: var(--warn-soft);   color: var(--warn); }
.b-fresh { background: var(--accent-soft); color: var(--accent); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  padding: 6px 11px; border-radius: 999px;
  background: var(--sunk); border: 1px solid transparent;
  font-size: 13px; font-weight: 600; cursor: pointer;
}
.chip.on { background: var(--accent); color: var(--on-accent); }

/* ─────────── 채널 고르기 ─────────── */

.pick {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 14px; margin-bottom: 8px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; cursor: pointer;
}
.pick.on { border-color: var(--accent); background: var(--accent-soft); }
.pick .box {
  width: 22px; height: 22px; flex: 0 0 auto;
  border: 2px solid var(--line); border-radius: 7px;
  display: grid; place-items: center; color: transparent;
}
.pick.on .box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pick .body { flex: 1; min-width: 0; }
.pick .name { display: block; font-size: 15px; font-weight: 700; }
.pick .meta { display: block; font-size: 12.5px; color: var(--dim); margin-top: 1px; }

/* ─────────── 게재 진행 화면 ─────────── */

.progress {
  height: 5px; border-radius: 3px; background: var(--sunk);
  overflow: hidden; margin-bottom: 16px;
}
.progress span { display: block; height: 100%; background: var(--accent); transition: width .25s; }

.step-head { text-align: center; margin-bottom: 4px; }
.step-count { font-size: 13px; font-weight: 700; color: var(--faint); }
.step-name  { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; }
.step-kind  { font-size: 13.5px; color: var(--dim); margin-top: 4px; }

.preview {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px;
  margin: 16px 0 10px;
  font-size: 14.5px; line-height: 1.65;
  white-space: pre-wrap; word-break: break-word;
  max-height: 300px; overflow-y: auto;
}

.counter { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--faint); margin: 0 4px 12px; }
.counter.over { color: var(--warn); font-weight: 700; }

.notice {
  background: var(--warn-soft); color: var(--warn);
  border-radius: 11px; padding: 11px 14px; margin-bottom: 12px;
  font-size: 13.5px; line-height: 1.6;
}
.notice ul { margin: 0; padding-left: 18px; }

.info {
  background: var(--sunk); color: var(--dim);
  border-radius: 11px; padding: 12px 14px; margin: 12px 0;
  font-size: 13px; line-height: 1.7;
}

/* ─────────── 카드 미리보기 ─────────── */

#cardWrap { text-align: center; margin: 8px 0 12px; }
#cardWrap canvas {
  width: 100%; max-width: 300px; height: auto;
  border-radius: 12px; border: 1px solid var(--line);
}

/* ─────────── 시트 ─────────── */

#sheet { position: fixed; inset: 0; z-index: 60; }
#sheetScrim { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
#sheetPanel {
  position: absolute; left: 0; right: 0; bottom: 0;
  max-height: 88vh;
  display: flex; flex-direction: column;
  background: var(--bg);
  border-radius: 20px 20px 0 0;
  overflow: hidden;
  animation: rise .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes rise { from { transform: translateY(24px); opacity: .4; } }

/* 시트가 화면을 거의 다 덮어도 닫을 곳이 있어야 합니다 — 손잡이 줄은 늘 보입니다. */
#sheetHead { position: relative; flex: 0 0 auto; padding: 8px 0 10px; }
#sheetGrip {
  width: 38px; height: 4px; border-radius: 2px;
  background: var(--line); margin: 6px auto 0;
}
#sheetClose {
  position: absolute; top: 4px; right: 8px;
  color: var(--dim);
}
#sheetBody {
  flex: 1 1 auto; overflow-y: auto;
  padding: 4px 16px calc(20px + var(--safe-b));
  -webkit-overflow-scrolling: touch;
}
.sheet-title { font-size: 17px; font-weight: 800; margin: 0 0 12px; }

/* ─────────── 토스트 ─────────── */

#toast {
  position: fixed; left: 50%; transform: translateX(-50%) translateY(20px);
  bottom: calc(var(--tabh) + var(--safe-b) + 18px); z-index: 80;
  max-width: 88vw; padding: 11px 18px;
  background: #202429; color: #fff;
  border-radius: 999px; font-size: 14px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─────────── 목록 줄 ─────────── */

.row {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px;
}
.row .body { flex: 1; min-width: 0; }
.row .name { font-size: 15px; font-weight: 700; }
.row .meta { font-size: 12.5px; color: var(--dim); margin-top: 1px;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .acts { display: flex; gap: 2px; flex: 0 0 auto; }
.row .acts button {
  width: 34px; height: 34px; display: grid; place-items: center;
  background: none; border: 0; border-radius: 8px; cursor: pointer; color: var(--faint);
}
.row .acts button:active { background: var(--sunk); }

</style>

<script>

`{{지역}} {{업체명}}입니다. {{직무}} 함께 하실 분 구해요.

{{근무시간}} 근무하시고, 급여는 {{급여}}입니다.
{{근무형태}}로 일하실 분이면 좋아요.
{{자격}}
{{복지}}

궁금한 점 있으시면 {{연락처}}로 편하게 연락 주세요.`,

    openchat:
`[{{지역}} {{직무}} 구합니다]
{{업체명}} · {{근무형태}}
{{근무시간}} / {{급여}}
문의 {{연락처}}`,

    sms:
`[{{업체명}}] {{지역}} {{직무}} 모집 {{급여}} 문의 {{연락처}}`,

    etc:
`{{지역}} {{업체명}} {{직무}} 모집

{{근무형태}} / {{근무시간}} / {{급여}}
{{자격}}
{{상세}}

문의 {{연락처}}`,
  };

  const EMPTY_POSTING = () => ({
    id: uid(),
    업체명: '', 직무: '', 지역: '',
    근무형태: '', 근무시간: '', 급여: '',
    자격: '', 복지: '', 상세: '',
    연락처: '', 마감: '',
    태그: '',
    createdAt: Date.now(),
    updatedAt: Date.now(),
  });

  /* 공고에서 쓰는 항목 순서 — 편집 화면과 템플릿 도우미가 이걸 따라갑니다. */
  const FIELDS = [
    { key: '업체명',   hint: '가게·회사 이름',            type: 'line' },
    { key: '직무',     hint: '주방보조, 배송기사, 홀서빙…', type: 'line' },
    { key: '지역',     hint: '수원 영통, 강남역 3번출구…',  type: 'line' },
    { key: '근무형태', hint: '주 5일 / 주말 알바 / 단기',   type: 'line' },
    { key: '근무시간', hint: '오전 9시~오후 6시',           type: 'line' },
    { key: '급여',     hint: '시급 12,000원 / 월 280만원',  type: 'line' },
    { key: '자격',     hint: '경력 무관, 초보 환영',        type: 'text' },
    { key: '복지',     hint: '식사 제공, 4대보험, 주차 가능', type: 'text' },
    { key: '상세',     hint: '길게 쓰고 싶은 이야기',       type: 'text' },
    { key: '연락처',   hint: '010-0000-0000',              type: 'line' },
    { key: '마감',     hint: '채용 시 마감 / 3월 20일',     type: 'line' },
    { key: '태그',     hint: '#수원알바 #주방보조',         type: 'line' },
  ];

  let state = load();

  /* ─────────── 저장 · 불러오기 ─────────── */

  function blank() {
    return {
      postings: [],
      channels: SEED_CHANNELS.map((c, i) => ({ id: uid(), enabled: true, order: i, ...c })),
      templates: { ...SEED_TEMPLATES },
      logs: [],
      settings: { cardTheme: 'ink' },
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return blank();
      const s = JSON.parse(raw);
      // 나중에 항목이 늘어나도 예전 저장본이 깨지지 않게 채워 둡니다.
      const base = blank();
      return {
        postings: s.postings || [],
        channels: s.channels || base.channels,
        templates: { ...base.templates, ...(s.templates || {}) },
        logs: s.logs || [],
        settings: { ...base.settings, ...(s.settings || {}) },
      };
    } catch (e) {
      console.warn('저장본을 읽지 못해 새로 시작합니다', e);
      return blank();
    }
  }

  let warnedAboutSaving = false;

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      // 저장이 막힌 상황(용량 초과·사생활 보호 모드 등).
      // 조용히 죽는 것보다 알려주는 편이 낫지만, 한 번만 알립니다.
      if (!warnedAboutSaving) {
        warnedAboutSaving = true;
        alert('이 기기에 저장할 수 없습니다.\n' +
              '저장 공간이 찼거나 브라우저가 저장을 막고 있습니다. ' +
              '지금 쓰신 내용은 창을 닫으면 사라집니다.');
      }
    }
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* ─────────── 공고 ─────────── */

  const postings = () => state.postings.slice().sort((a, b) => b.updatedAt - a.updatedAt);
  const posting  = (id) => state.postings.find(p => p.id === id);

  function upsertPosting(p) {
    p.updatedAt = Date.now();
    const i = state.postings.findIndex(x => x.id === p.id);
    if (i >= 0) state.postings[i] = p; else state.postings.push(p);
    save();
    return p;
  }

  function removePosting(id) {
    state.postings = state.postings.filter(p => p.id !== id);
    state.logs     = state.logs.filter(l => l.postingId !== id);
    save();
  }

  /** 공고를 그대로 베낍니다. 비슷한 자리를 또 올릴 때 씁니다. */
  function duplicatePosting(id) {
    const src = posting(id);
    if (!src) return null;
    const copy = { ...src, id: uid(), createdAt: Date.now(), updatedAt: Date.now() };
    state.postings.push(copy);
    save();
    return copy;
  }

  /* ─────────── 채널 ─────────── */

  const channels = () => state.channels.slice().sort((a, b) => a.order - b.order);
  const channel  = (id) => state.channels.find(c => c.id === id);
  const activeChannels = () => channels().filter(c => c.enabled);

  function upsertChannel(c) {
    const i = state.channels.findIndex(x => x.id === c.id);
    if (i >= 0) state.channels[i] = c;
    else {
      c.id = c.id || uid();
      c.order = state.channels.length;
      state.channels.push(c);
    }
    save();
    return c;
  }

  function removeChannel(id) {
    state.channels = state.channels.filter(c => c.id !== id);
    state.logs     = state.logs.filter(l => l.channelId !== id);
    save();
  }

  function moveChannel(id, dir) {
    const list = channels();
    const i = list.findIndex(c => c.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    [list[i].order, list[j].order] = [list[j].order, list[i].order];
    save();
  }

  /* ─────────── 문안 템플릿 ─────────── */

  /** 채널에 개별 템플릿이 있으면 그것을, 없으면 종류별 기본 템플릿을 씁니다. */
  function templateFor(ch) {
    if (ch && ch.template) return ch.template;
    return state.templates[ch ? ch.kind : 'etc'] || state.templates.etc;
  }

  function setTemplate(kind, text) {
    state.templates[kind] = text;
    save();
  }

  function resetTemplate(kind) {
    state.templates[kind] = SEED_TEMPLATES[kind];
    save();
  }

  /* ─────────── 게재 이력 ─────────── */

  function logPost(postingId, channelId) {
    state.logs.push({ id: uid(), postingId, channelId, at: Date.now() });
    save();
  }

  function unlogLast(postingId, channelId) {
    // 실수로 눌렀을 때 되돌리기 — 가장 최근 것 하나만 지웁니다.
    let last = -1;
    state.logs.forEach((l, i) => {
      if (l.postingId === postingId && l.channelId === channelId) last = i;
    });
    if (last >= 0) { state.logs.splice(last, 1); save(); }
    return last >= 0;
  }

  const logs = () => state.logs.slice().sort((a, b) => b.at - a.at);

  /** 이 공고를 이 채널에 마지막으로 올린 시각 (없으면 null) */
  function lastPostedAt(postingId, channelId) {
    let t = null;
    for (const l of state.logs) {
      if (l.postingId === postingId && l.channelId === channelId) {
        if (t === null || l.at > t) t = l.at;
      }
    }
    return t;
  }

  const DAY = 86400000;

  /**
   * 채널별 게재 상태를 계산합니다.
   *   status: 'never'  아직 안 올림
   *           'due'    끌어올릴 때가 됨
   *           'fresh'  아직 올려둔 게 살아 있음
   */
  function statusOf(postingId, ch) {
    const at = lastPostedAt(postingId, ch.id);
    if (at === null) return { status: 'never', at: null, days: null, dueIn: 0 };
    const days = Math.floor((Date.now() - at) / DAY);
    const bump = ch.bumpDays || 7;
    return {
      status: days >= bump ? 'due' : 'fresh',
      at, days,
      dueIn: Math.max(0, bump - days),
    };
  }

  /** 오늘 손봐야 할 것들 — 홈 화면 맨 위에 뜨는 목록입니다. */
  function todo() {
    const out = [];
    for (const p of state.postings) {
      for (const ch of activeChannels()) {
        const s = statusOf(p.id, ch);
        if (s.status !== 'fresh') out.push({ posting: p, channel: ch, ...s });
      }
    }
    // 오래 방치된 것부터
    return out.sort((a, b) => (b.days === null ? 1e9 : b.days) - (a.days === null ? 1e9 : a.days));
  }

  /* ─────────── 설정 · 백업 ─────────── */

  const settings = () => state.settings;

  function setSetting(k, v) { state.settings[k] = v; save(); }

  function exportJSON() {
    return JSON.stringify({ app: 'guin-caster', version: 1, exportedAt: Date.now(), data: state }, null, 2);
  }

  function importJSON(text) {
    const parsed = JSON.parse(text);
    const data = parsed.data || parsed;
    if (!data || !Array.isArray(data.postings)) throw new Error('구인 캐스터 백업 파일이 아닙니다.');
    state = {
      postings: data.postings || [],
      channels: data.channels || blank().channels,
      templates: { ...SEED_TEMPLATES, ...(data.templates || {}) },
      logs: data.logs || [],
      settings: { ...blank().settings, ...(data.settings || {}) },
    };
    save();
  }

  function wipe() {
    state = blank();
    save();
  }

  return {
    KINDS, FIELDS, EMPTY_POSTING, uid,
    postings, posting, upsertPosting, removePosting, duplicatePosting,
    channels, channel, activeChannels, upsertChannel, removeChannel, moveChannel,
    templateFor, setTemplate, resetTemplate, templates: () => state.templates,
    logPost, unlogLast, logs, lastPostedAt, statusOf, todo,
    settings, setSetting, exportJSON, importJSON, wipe,
  };

})();

</script>
<script>
/* compose.js — 공고 하나를 채널별 문안으로 바꾸는 엔진
 *
 * 규칙은 두 개뿐입니다.
 *   1. {{항목}} 자리에 공고 내용이 들어간다.
 *   2. 내용이 비어 있는 {{항목}} 이 들어간 줄은 통째로 사라진다.
 *
 * 2번 덕분에 공고를 대충 채워도 문안에 "급여 : " 같은 빈 껍데기가 남지 않습니다.
 */

const Compose = (() => {

  const TOKEN = /\{\{\s*([^}]+?)\s*\}\}/g;

  /** 템플릿에서 쓸 수 있는 항목 이름 목록 (편집 화면의 도우미 칩) */
  const tokens = () => Store.FIELDS.map(f => f.key);

  function valueOf(posting, key) {
    const v = posting[key];
    return (v === undefined || v === null) ? '' : String(v).trim();
  }

  /**
   * 템플릿 + 공고 → 완성된 문안
   * 여러 줄짜리 항목(상세·자격·복지)은 줄 수만큼 늘어납니다.
   */
  function render(template, posting) {
    const lines = String(template || '').split('\n');
    const out = [];

    for (const line of lines) {
      const used = [...line.matchAll(TOKEN)].map(m => m[1]);

      // 이 줄이 쓰는 항목 중 하나라도 비어 있으면 줄을 버립니다.
      if (used.length && used.some(k => valueOf(posting, k) === '')) continue;

      let filled = line.replace(TOKEN, (_, k) => valueOf(posting, k));

      // 항목 안에 줄바꿈이 있으면 그만큼 줄을 늘립니다.
      out.push(...filled.split('\n'));
    }

    return tidy(out.join('\n'));
  }

  /** 빈 줄이 세 줄 이상 이어지는 것만 정리합니다. 문단 사이 한 줄은 그대로 둡니다. */
  function tidy(text) {
    return text
      .replace(/[ \t]+$/gm, '')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }

  /** 채널 하나에 올릴 문안 */
  function forChannel(posting, channel) {
    return render(Store.templateFor(channel), posting);
  }

  /** 글자수 상태 — 채널 권장 길이를 넘었는지 */
  function measure(text, channel) {
    const kind = Store.KINDS[channel.kind] || Store.KINDS.etc;
    const n = text.length;
    return {
      count: n,
      limit: kind.limit,
      over: n > kind.limit,
      ratio: Math.min(1, n / kind.limit),
    };
  }

  /**
   * 공고를 올리기 전에 짚어줄 것들.
   * 막지는 않습니다 — 비워두는 게 맞는 경우도 있으니까요.
   */
  function warnings(posting) {
    const w = [];
    if (!valueOf(posting, '직무'))   w.push('직무가 비어 있습니다. 제목이 "구합니다"만 남습니다.');
    if (!valueOf(posting, '연락처')) w.push('연락처가 없으면 지원이 들어올 방법이 없습니다.');
    if (!valueOf(posting, '급여'))   w.push('급여를 적은 공고가 문의가 확실히 많습니다.');
    if (!valueOf(posting, '지역'))   w.push('지역이 없으면 동네 채널에서 잘 안 눌립니다.');

    const pay = valueOf(posting, '급여');
    // 2026년 최저임금 10,320원. 시급 표기가 이보다 낮으면 오타일 가능성이 큽니다.
    const m = pay.match(/시급\s*([\d,]+)/);
    if (m) {
      const won = parseInt(m[1].replace(/,/g, ''), 10);
      if (won && won < 10320) w.push(`시급 ${m[1]}원은 2026년 최저임금(10,320원)보다 낮습니다. 확인해 주세요.`);
    }
    return w;
  }

  /** 공고 목록에 보여줄 한 줄 요약 */
  function summary(posting) {
    const bits = ['지역', '직무', '급여'].map(k => valueOf(posting, k)).filter(Boolean);
    return bits.join(' · ') || '내용 없음';
  }

  function title(posting) {
    const 직무 = valueOf(posting, '직무');
    const 업체 = valueOf(posting, '업체명');
    if (직무 && 업체) return `${업체} ${직무}`;
    return 직무 || 업체 || '이름 없는 공고';
  }

  return { render, forChannel, measure, warnings, summary, title, tokens, tidy };

})();

</script>
<script>
/* publish.js — 문안을 실제로 채널까지 옮기는 부분
 *
 * 여기서 분명히 해둘 것: 이 앱은 대신 글을 올려주지 않습니다.
 * 블로그·카페·당근·오픈톡 어디에도 "외부 프로그램이 글을 등록하는" 공식 통로가 없습니다.
 * (네이버 블로그 글쓰기 API는 2020년에 폐지됐고, 카카오는 임의의 오픈톡방에
 *  메시지를 보내는 API를 열어두지 않았습니다.)
 *
 * 그래서 하는 일은 이겁니다 — 문안을 클립보드에 넣고, 그 채널을 띄우고,
 * 돌아오면 "올렸음"으로 기록합니다. 붙여넣기 한 번만 사람이 합니다.
 */

const Publish = (() => {

  /* ─────────── 클립보드 ─────────── */

  async function copy(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      // 권한이 없거나 https 가 아닐 때 — 옛날 방식으로 한 번 더 시도합니다.
      return legacyCopy(text);
    }
  }

  function legacyCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  /* ─────────── 공유 (카톡으로 바로 보낼 때) ─────────── */

  const canShare = () => typeof navigator.share === 'function';

  async function share(text, title) {
    if (!canShare()) return false;
    try {
      await navigator.share({ text, title: title || '구인 공고' });
      return true;
    } catch (e) {
      // 사용자가 공유 창을 닫은 것도 여기로 옵니다 — 실패로 치지 않습니다.
      return e && e.name === 'AbortError' ? 'cancel' : false;
    }
  }

  /** 이미지까지 같이 공유 (오픈톡·당근에 카드 이미지를 붙일 때) */
  async function shareWithImage(text, blob, filename) {
    if (!canShare() || !blob) return share(text);
    const file = new File([blob], filename || '공고.png', { type: 'image/png' });
    if (navigator.canShare && !navigator.canShare({ files: [file] })) return share(text);
    try {
      await navigator.share({ text, files: [file] });
      return true;
    } catch (e) {
      return e && e.name === 'AbortError' ? 'cancel' : false;
    }
  }

  /* ─────────── 채널 열기 ─────────── */

  /** 카카오톡 앱 자체를 띄우는 주소. 특정 방까지는 못 갑니다 — 방 선택은 사람이 합니다. */
  const KAKAO_SCHEME = 'kakaotalk://';

  /** 새 탭으로 띄웁니다. 팝업이 막히는 곳(웹뷰·iframe)에서는 링크 클릭으로 우회합니다. */
  function openUrl(url) {
    let w = null;
    try { w = window.open(url, '_blank', 'noopener'); } catch (e) { w = null; }
    if (w) return true;

    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    return true;
  }

  function open(channel) {
    const url = (channel.url || '').trim();

    if (url) return openUrl(url);

    // 주소를 안 적어둔 오픈톡·단톡 채널이면 카카오톡을 띄웁니다.
    if (channel.kind === 'openchat') {
      try { location.href = KAKAO_SCHEME; } catch (e) { return openUrl(KAKAO_SCHEME); }
      return true;
    }

    return false; // 열 곳이 없음 — 화면에서 안내합니다.
  }

  /* ─────────── 게재 큐 ───────────
   * 공고 하나를 여러 채널에 순서대로 올리는 흐름을 들고 있습니다.  */

  function makeQueue(postingId, channelIds) {
    return {
      postingId,
      ids: channelIds.slice(),
      index: 0,
      done: [],
      get current() { return Store.channel(this.ids[this.index]); },
      get remaining() { return this.ids.length - this.index; },
      get finished() { return this.index >= this.ids.length; },
      /** 올렸다고 기록하고 다음 채널로 */
      complete() {
        const ch = this.current;
        if (!ch) return;
        Store.logPost(this.postingId, ch.id);
        this.done.push(ch.id);
        this.index++;
      },
      /** 이번 채널은 건너뛰기 (기록하지 않음) */
      skip() { this.index++; },
      back() { if (this.index > 0) this.index--; },
    };
  }

  /* ─────────── 파일로 내려받기 ─────────── */

  function download(filename, content, type) {
    const blob = content instanceof Blob ? content : new Blob([content], { type: type || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  return { copy, share, shareWithImage, canShare, open, makeQueue, download };

})();

</script>
<script>
/* card.js — 공고 요약을 이미지 한 장으로
 *
 * 오픈톡방이나 당근처럼 글이 순식간에 밀려나는 곳에서는
 * 텍스트보다 이미지 한 장이 훨씬 오래 남습니다.
 * 외부 라이브러리 없이 캔버스로만 그립니다.
 */

const Card = (() => {

  const W = 1080, H = 1350;

  const THEMES = {
    ink:   { name: '먹',     bg: ['#14161A', '#20242B'], fg: '#F4F5F7', dim: '#9AA3AF', accent: '#7BD88F', chip: '#2A2F38' },
    paper: { name: '종이',   bg: ['#FBF7F0', '#F1EADD'], fg: '#1E1B16', dim: '#6E6252', accent: '#B4562A', chip: '#E6DCCA' },
    sky:   { name: '하늘',   bg: ['#0E2A47', '#164066'], fg: '#F2F7FC', dim: '#9EC0DC', accent: '#FFD166', chip: '#1D4E7A' },
    warm:  { name: '노을',   bg: ['#3A1E2A', '#63303A'], fg: '#FDF2EE', dim: '#D8A9A2', accent: '#FFB4A2', chip: '#572B36' },
  };

  const themeList = () => Object.entries(THEMES).map(([id, t]) => ({ id, ...t }));

  /* 시스템에 있는 한글 폰트를 순서대로 시도합니다. */
  const FONT = `"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif`;
  const font = (weight, size) => `${weight} ${size}px ${FONT}`;

  /** 글자를 폭에 맞춰 여러 줄로 자릅니다. 한글은 글자 단위로 끊어도 자연스럽습니다. */
  function wrap(ctx, text, maxWidth, maxLines) {
    const words = String(text).split(/(\s+)/);
    const lines = [];
    let line = '';

    const pushChar = (chunk) => {
      for (const ch of chunk) {
        if (ctx.measureText(line + ch).width > maxWidth && line) {
          lines.push(line); line = ch;
        } else line += ch;
      }
    };

    for (const w of words) {
      if (ctx.measureText(line + w).width <= maxWidth) { line += w; continue; }
      if (ctx.measureText(w).width > maxWidth) { pushChar(w); continue; }
      lines.push(line.trimEnd()); line = w.trimStart();
    }
    if (line.trim()) lines.push(line.trimEnd());

    if (maxLines && lines.length > maxLines) {
      const cut = lines.slice(0, maxLines);
      cut[maxLines - 1] = cut[maxLines - 1].replace(/.$/, '…');
      return cut;
    }
    return lines;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  /**
   * 공고 → 캔버스
   * 값이 빈 항목은 아예 그리지 않습니다. 문안 규칙과 같습니다.
   */
  function draw(posting, themeId) {
    const t = THEMES[themeId] || THEMES.ink;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');

    // 배경
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, t.bg[0]);
    g.addColorStop(1, t.bg[1]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const M = 88;                 // 좌우 여백
    const inner = W - M * 2;

    // 글자를 위쪽 기준으로 그립니다. 기준선(baseline)으로 그리면
    // 글자 크기가 바뀔 때마다 간격을 다시 계산해야 하고, 큰 글자가 위를 침범합니다.
    ctx.textBaseline = 'top';

    const CONTACT_H = 132;
    const CONTACT_Y = H - 100 - CONTACT_H;

    let y = 120;
    const v = (k) => String(posting[k] || '').trim();

    // 마감 — 오른쪽 위 귀퉁이
    if (v('마감')) {
      ctx.font = font(600, 32);
      ctx.textAlign = 'right';
      ctx.fillStyle = t.dim;
      ctx.fillText(v('마감'), W - M, 66);
      ctx.textAlign = 'left';
    }

    // 지역 — 맨 위 작은 라벨
    if (v('지역')) {
      ctx.font = font(600, 38);
      ctx.fillStyle = t.accent;
      ctx.fillText(v('지역'), M, y);
      y += 58;
    }

    // 직무 — 제일 크게
    if (v('직무')) {
      ctx.font = font(800, 96);
      ctx.fillStyle = t.fg;
      for (const line of wrap(ctx, v('직무'), inner, 3)) {
        ctx.fillText(line, M, y);
        y += 112;
      }
      y += 14;
    }

    // 업체명
    if (v('업체명')) {
      ctx.font = font(500, 44);
      ctx.fillStyle = t.dim;
      ctx.fillText(wrap(ctx, v('업체명'), inner, 1)[0], M, y);
      y += 62;
    }

    // 구분선
    y += 20;
    ctx.strokeStyle = t.chip;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(M, y); ctx.lineTo(W - M, y); ctx.stroke();
    y += 46;

    // 핵심 항목 — 라벨 + 값
    const rows = [
      ['급여',     v('급여')],
      ['근무시간', v('근무시간')],
      ['근무형태', v('근무형태')],
    ].filter(r => r[1]);

    for (const [label, val] of rows) {
      ctx.font = font(700, 50);
      const lines = wrap(ctx, val, inner - 260, 2);

      // 라벨은 작으니 살짝 내려야 값과 눈높이가 맞습니다.
      ctx.font = font(500, 36);
      ctx.fillStyle = t.dim;
      ctx.fillText(label, M, y + 9);

      ctx.font = font(700, 50);
      ctx.fillStyle = t.fg;
      lines.forEach((line, i) => ctx.fillText(line, M + 260, y + i * 62));

      y += 62 * lines.length + 34;
    }

    // 자격·복지 — 연락처 칸까지 남은 공간에 들어가는 만큼만
    const extra = [v('자격'), v('복지')].filter(Boolean).join(' · ').replace(/\n+/g, ' · ');
    const room = Math.floor((CONTACT_Y - 40 - y) / 52);
    if (extra && room > 0) {
      ctx.font = font(400, 38);
      ctx.fillStyle = t.dim;
      for (const line of wrap(ctx, extra, inner, Math.min(3, room))) {
        ctx.fillText(line, M, y);
        y += 52;
      }
    }

    // 연락처 — 아래쪽에 고정. 이게 없으면 카드가 아무 소용이 없습니다.
    if (v('연락처')) {
      ctx.fillStyle = t.accent;
      roundRect(ctx, M, CONTACT_Y, inner, CONTACT_H, 28);
      ctx.fill();

      ctx.font = font(500, 30);
      ctx.fillStyle = t.bg[0];
      ctx.globalAlpha = 0.7;
      ctx.fillText('문의', M + 40, CONTACT_Y + 24);
      ctx.globalAlpha = 1;

      ctx.font = font(800, 54);
      ctx.fillStyle = t.bg[0];
      ctx.fillText(wrap(ctx, v('연락처'), inner - 80, 1)[0], M + 40, CONTACT_Y + 60);
    }

    return cv;
  }

  function toBlob(canvas) {
    return new Promise(res => canvas.toBlob(res, 'image/png'));
  }

  return { draw, toBlob, THEMES, themeList, W, H };

})();

</script>
<script>
/* ui.js — 화면 */

const UI = (() => {

  const view      = document.getElementById('view');
  const topbar    = document.getElementById('topbar');
  const topTitle  = document.getElementById('topTitle');
  const topAction = document.getElementById('topAction');
  const backBtn   = document.getElementById('backBtn');
  const tabbar    = document.getElementById('tabbar');
  const sheet     = document.getElementById('sheet');
  const sheetBody = document.getElementById('sheetBody');
  const toastEl   = document.getElementById('toast');

  let route = { name: 'home', param: null };
  let stack = [];
  let queue = null;          // 진행 중인 게재 큐
  let draftText = null;      // 이번 채널에서 손본 문안

  /* ─────────── 잡동사니 ─────────── */

  const esc = (s) => String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('on'), 2000);
  }

  function when(ts) {
    if (!ts) return '';
    const d = Math.floor((Date.now() - ts) / 86400000);
    if (d <= 0) return '오늘';
    if (d === 1) return '어제';
    if (d < 30) return `${d}일 전`;
    const dt = new Date(ts);
    return `${dt.getMonth() + 1}월 ${dt.getDate()}일`;
  }

  function statusPill(s) {
    if (s.status === 'never') return `<span class="badge-pill b-never">미게재</span>`;
    if (s.status === 'due')   return `<span class="badge-pill b-due">올릴 때 · ${when(s.at)}</span>`;
    return `<span class="badge-pill b-fresh">${s.dueIn}일 뒤</span>`;
  }

  /* ─────────── 이동 ─────────── */

  function go(name, param, replace) {
    if (!replace && route.name !== name) stack.push({ ...route });
    route = { name, param: param === undefined ? null : param };
    render();
    view.scrollTop = 0;
    window.scrollTo(0, 0);
  }

  function back() {
    if (stack.length) { route = stack.pop(); render(); }
    else go('home', null, true);
  }

  function tabTo(name) {
    stack = [];
    route = { name, param: null };
    render();
    window.scrollTo(0, 0);
  }

  /* ─────────── 시트 ─────────── */

  function openSheet(title, html, bind) {
    sheetBody.innerHTML = (title ? `<h2 class="sheet-title">${esc(title)}</h2>` : '') + html;
    sheet.classList.remove('hidden');
    if (bind) bind(sheetBody);
  }
  function closeSheet() {
    sheet.classList.add('hidden');
    sheetBody.innerHTML = '';
  }

  /* ─────────── 그리기 ─────────── */

  const VIEWS = {};

  function render() {
    const v = VIEWS[route.name] || VIEWS.home;
    topAction.className = 'txt-btn hidden';
    topAction.onclick = null;
    backBtn.classList.toggle('hidden', stack.length === 0);
    v(route.param);
    paintTabs();
  }

  function paintTabs() {
    const map = { home: 'home', edit: 'home', cast: 'cast', castPick: 'cast', castRun: 'cast',
                  channels: 'channels', templates: 'channels', more: 'more' };
    const active = map[route.name] || 'home';
    const due = Store.todo().filter(t => t.status === 'due').length;
    tabbar.querySelectorAll('.tab').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === active);
      const old = b.querySelector('.badge');
      if (old) old.remove();
      if (b.dataset.tab === 'cast' && due > 0) {
        const s = document.createElement('span');
        s.className = 'badge';
        s.textContent = due > 99 ? '99+' : due;
        b.appendChild(s);
      }
    });
  }

  function setTop(title, actionLabel, onAction) {
    topTitle.textContent = title;
    if (actionLabel) {
      topAction.textContent = actionLabel;
      topAction.className = 'txt-btn';
      topAction.onclick = onAction;
    }
  }

  /* ═══════════════ 공고 목록 ═══════════════ */

  VIEWS.home = () => {
    setTop('공고', '새 공고', () => {
      const p = Store.EMPTY_POSTING();
      Store.upsertPosting(p);
      go('edit', p.id);
    });

    const list = Store.postings();
    const due  = Store.todo().filter(t => t.status === 'due');

    if (!list.length) {
      view.innerHTML = `
        <div class="empty">
          <strong>아직 공고가 없습니다</strong>
          <p>공고를 한 번만 쓰면<br>채널 수만큼 문안이 자동으로 만들어집니다.</p>
        </div>
        <button class="btn primary" id="firstBtn">첫 공고 쓰기</button>
        <div class="info">
          이 앱은 글을 대신 올려주지 않습니다. 블로그·카페·당근·오픈톡 어디에도
          외부 프로그램이 글을 등록하는 통로가 없기 때문입니다.
          대신 <b>문안을 만들고, 복사해두고, 그 채널을 띄우고, 언제 다시 올릴지 기억</b>합니다.
          붙여넣기 한 번만 직접 하시면 됩니다.
        </div>`;
      view.querySelector('#firstBtn').onclick = () => {
        const p = Store.EMPTY_POSTING();
        Store.upsertPosting(p);
        go('edit', p.id);
      };
      return;
    }

    const chs = Store.activeChannels();

    view.innerHTML = `
      ${due.length ? `
        <div class="card tap" id="dueCard" style="border-color:var(--warn)">
          <div class="card-title" style="color:var(--warn)">다시 올릴 곳 ${due.length}군데</div>
          <div class="card-sub">${esc(due.slice(0, 3).map(d => d.channel.name).join(', '))}${due.length > 3 ? ` 외 ${due.length - 3}` : ''}</div>
        </div>` : ''}

      <div class="section-label">공고 ${list.length}개</div>
      ${list.map(p => {
        const posted = chs.filter(c => Store.lastPostedAt(p.id, c.id)).length;
        return `
        <div class="card tap" data-id="${p.id}">
          <div class="card-title">${esc(Compose.title(p))}</div>
          <div class="card-sub">${esc(Compose.summary(p))}</div>
          <div class="card-sub" style="margin-top:6px">
            <span class="badge-pill ${posted ? 'b-fresh' : 'b-never'}">${posted}/${chs.length} 채널</span>
            &nbsp;수정 ${when(p.updatedAt)}
          </div>
        </div>`;
      }).join('')}`;

    const dueCard = view.querySelector('#dueCard');
    if (dueCard) dueCard.onclick = () => tabTo('cast');
    view.querySelectorAll('.card[data-id]').forEach(el => {
      el.onclick = () => go('edit', el.dataset.id);
    });
  };

  /* ═══════════════ 공고 편집 ═══════════════ */

  VIEWS.edit = (id) => {
    const p = Store.posting(id);
    if (!p) return go('home', null, true);

    setTop('공고 쓰기', '완료', () => { flush(); back(); });

    view.innerHTML = `
      ${Store.FIELDS.map(f => `
        <div class="field">
          <label for="f-${f.key}">${esc(f.key)} <span class="hint">${esc(f.hint)}</span></label>
          ${f.type === 'text'
            ? `<textarea class="textarea" id="f-${f.key}" data-key="${f.key}" rows="3">${esc(p[f.key])}</textarea>`
            : `<input class="input" id="f-${f.key}" data-key="${f.key}" value="${esc(p[f.key])}">`}
        </div>`).join('')}

      <div id="warnBox"></div>

      <div class="btn-row">
        <button class="btn primary" id="goCast">이 공고 올리러 가기</button>
      </div>
      <div class="btn-row">
        <button class="btn" id="previewBtn">채널별 문안 보기</button>
        <button class="btn" id="dupBtn">복제</button>
      </div>
      <div class="btn-row">
        <button class="btn ghost danger" id="delBtn">이 공고 삭제</button>
      </div>`;

    const inputs = view.querySelectorAll('[data-key]');
    let timer;
    const flushNow = () => {
      inputs.forEach(el => { p[el.dataset.key] = el.value; });
      Store.upsertPosting(p);
      paintWarn();
    };
    function flush() { clearTimeout(timer); flushNow(); }

    inputs.forEach(el => {
      el.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(flushNow, 400);
      });
      if (el.tagName === 'TEXTAREA') {
        const grow = () => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; };
        el.addEventListener('input', grow);
        grow();
      }
    });

    function paintWarn() {
      const w = Compose.warnings(p);
      view.querySelector('#warnBox').innerHTML = w.length
        ? `<div class="notice"><ul>${w.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`
        : '';
    }
    paintWarn();

    view.querySelector('#goCast').onclick    = () => { flush(); go('castPick', p.id); };
    view.querySelector('#previewBtn').onclick = () => { flush(); previewSheet(p); };
    view.querySelector('#dupBtn').onclick    = () => {
      flush();
      const c = Store.duplicatePosting(p.id);
      toast('복제했습니다');
      go('edit', c.id, true);
    };
    view.querySelector('#delBtn').onclick = () => {
      if (!confirm('이 공고와 게재 이력을 지웁니다. 되돌릴 수 없습니다.')) return;
      Store.removePosting(p.id);
      stack = [];
      go('home', null, true);
    };
  };

  /** 채널별로 어떤 문안이 나오는지 한 번에 훑어보는 시트 */
  function previewSheet(p) {
    const chs = Store.activeChannels();
    openSheet('채널별 문안', chs.map(ch => {
      const text = Compose.forChannel(p, ch);
      const m = Compose.measure(text, ch);
      return `
        <div class="section-label">${esc(ch.name)}</div>
        <div class="preview" style="max-height:200px">${esc(text) || '<i>내용이 없습니다</i>'}</div>
        <div class="counter ${m.over ? 'over' : ''}">
          <span>${m.count}자</span><span>권장 ${m.limit}자</span>
        </div>`;
    }).join('') || '<div class="info">켜져 있는 채널이 없습니다.</div>');
  }

  /* ═══════════════ 게재 — 공고 고르기 ═══════════════ */

  VIEWS.cast = () => {
    setTop('게재');
    const list = Store.postings();

    if (!list.length) {
      view.innerHTML = `<div class="empty"><strong>올릴 공고가 없습니다</strong><p>공고 탭에서 먼저 하나 써주세요.</p></div>`;
      return;
    }

    const chs = Store.activeChannels();
    const due = Store.todo().filter(t => t.status === 'due');

    view.innerHTML = `
      ${due.length ? `<div class="notice">
        <b>${due.length}군데</b>가 끌어올릴 때가 됐습니다.
        오래 방치된 순서로 정리했습니다.
      </div>` : ''}

      <div class="section-label">공고를 고르세요</div>
      ${list.map(p => {
        const posted = chs.filter(c => Store.lastPostedAt(p.id, c.id)).length;
        const d = due.filter(x => x.posting.id === p.id).length;
        return `
        <div class="card tap" data-id="${p.id}">
          <div class="card-title">${esc(Compose.title(p))}</div>
          <div class="card-sub">${esc(Compose.summary(p))}</div>
          <div class="card-sub" style="margin-top:6px">
            <span class="badge-pill ${posted ? 'b-fresh' : 'b-never'}">${posted}/${chs.length} 채널</span>
            ${d ? `&nbsp;<span class="badge-pill b-due">${d}군데 올릴 때</span>` : ''}
          </div>
        </div>`;
      }).join('')}`;

    view.querySelectorAll('.card[data-id]').forEach(el => {
      el.onclick = () => go('castPick', el.dataset.id);
    });
  };

  /* ═══════════════ 게재 — 채널 고르기 ═══════════════ */

  let picked = new Set();

  VIEWS.castPick = (id) => {
    const p = Store.posting(id);
    if (!p) return go('cast', null, true);

    setTop(Compose.title(p));
    const chs = Store.activeChannels();

    if (!chs.length) {
      view.innerHTML = `<div class="empty"><strong>켜진 채널이 없습니다</strong><p>채널 탭에서 올릴 곳을 먼저 등록해 주세요.</p></div>`;
      return;
    }

    // 처음 들어오면 "아직 안 올렸거나 올릴 때가 된 곳"을 미리 체크해 둡니다.
    picked = new Set(chs.filter(c => Store.statusOf(p.id, c).status !== 'fresh').map(c => c.id));

    const warn = Compose.warnings(p);

    view.innerHTML = `
      ${warn.length ? `<div class="notice"><ul>${warn.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      <div class="section-label">올릴 곳</div>
      <div id="picks">
        ${chs.map(c => {
          const s = Store.statusOf(p.id, c);
          const kind = Store.KINDS[c.kind] || Store.KINDS.etc;
          return `
          <div class="pick ${picked.has(c.id) ? 'on' : ''}" data-id="${c.id}">
            <span class="box"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="body">
              <span class="name">${esc(c.name)}</span>
              <span class="meta">${esc(kind.label)} · ${s.at ? `마지막 ${when(s.at)}` : '올린 적 없음'}</span>
            </span>
            ${statusPill(s)}
          </div>`;
        }).join('')}
      </div>

      <div class="btn-row">
        <button class="btn sm ghost" id="allBtn" style="flex:1">전체 선택</button>
        <button class="btn sm ghost" id="noneBtn" style="flex:1">전체 해제</button>
      </div>

      <div class="btn-row" style="margin-top:16px">
        <button class="btn primary" id="startBtn">게재 시작</button>
      </div>
      <div class="info">
        고른 채널을 하나씩 띄워 드립니다. 문안은 미리 복사되어 있으니
        붙여넣기 → 등록 → <b>올렸어요</b> 만 누르시면 다음 채널로 넘어갑니다.
      </div>`;

    const repaint = () => {
      view.querySelectorAll('.pick').forEach(el => el.classList.toggle('on', picked.has(el.dataset.id)));
      view.querySelector('#startBtn').disabled = picked.size === 0;
      view.querySelector('#startBtn').textContent = picked.size ? `게재 시작 · ${picked.size}군데` : '올릴 곳을 고르세요';
    };

    view.querySelectorAll('.pick').forEach(el => {
      el.onclick = () => {
        const cid = el.dataset.id;
        picked.has(cid) ? picked.delete(cid) : picked.add(cid);
        repaint();
      };
    });
    view.querySelector('#allBtn').onclick  = () => { picked = new Set(chs.map(c => c.id)); repaint(); };
    view.querySelector('#noneBtn').onclick = () => { picked = new Set(); repaint(); };
    view.querySelector('#startBtn').onclick = () => {
      const ids = chs.filter(c => picked.has(c.id)).map(c => c.id);
      if (!ids.length) return;
      queue = Publish.makeQueue(p.id, ids);
      draftText = null;
      go('castRun', p.id);
    };

    repaint();
  };

  /* ═══════════════ 게재 — 진행 ═══════════════ */

  VIEWS.castRun = (id) => {
    const p = Store.posting(id);
    if (!p || !queue) return go('cast', null, true);

    if (queue.finished) return finishView(p);

    const ch = queue.current;
    const kind = Store.KINDS[ch.kind] || Store.KINDS.etc;
    const text = draftText !== null ? draftText : Compose.forChannel(p, ch);
    const m = Compose.measure(text, ch);
    const total = queue.ids.length;
    const step = queue.index + 1;

    setTop(`${step} / ${total}`, '그만두기', () => {
      queue = null; stack = []; go('cast', null, true);
    });

    const isChat = ch.kind === 'openchat';

    view.innerHTML = `
      <div class="progress"><span style="width:${(queue.index / total) * 100}%"></span></div>

      <div class="step-head">
        <div class="step-count">${step}번째 · ${queue.remaining}군데 남음</div>
        <div class="step-name">${esc(ch.name)}</div>
        <div class="step-kind">${esc(kind.label)}${kind.desc ? ' — ' + esc(kind.desc) : ''}</div>
      </div>

      <div class="preview" id="prev">${esc(text)}</div>
      <div class="counter ${m.over ? 'over' : ''}">
        <span>${m.count}자${m.over ? ' — 권장보다 깁니다' : ''}</span>
        <span>권장 ${m.limit}자</span>
      </div>

      <div class="btn-row">
        <button class="btn primary" id="copyOpen">복사하고 ${esc(ch.name)} 열기</button>
      </div>
      <div class="btn-row">
        <button class="btn" id="copyBtn">복사만</button>
        ${Publish.canShare() ? `<button class="btn" id="shareBtn">${isChat ? '카톡으로 공유' : '공유'}</button>` : ''}
      </div>
      <div class="btn-row">
        <button class="btn" id="editBtn">이번만 다듬기</button>
        <button class="btn" id="cardBtn">이미지 카드</button>
      </div>

      <div class="btn-row" style="margin-top:20px">
        <button class="btn primary" id="doneBtn">올렸어요 → 다음</button>
      </div>
      <div class="btn-row">
        <button class="btn ghost" id="skipBtn">이번은 건너뛰기</button>
        ${queue.index > 0 ? `<button class="btn ghost" id="prevBtn">이전으로</button>` : ''}
      </div>

      ${!ch.url && !isChat ? `<div class="info">
        이 채널에 주소가 등록되어 있지 않아 "열기"가 동작하지 않습니다.
        채널 탭에서 글쓰기 주소를 넣어두면 한 번에 열립니다.
      </div>` : ''}`;

    const el = (s) => view.querySelector(s);

    el('#copyOpen').onclick = async () => {
      const ok = await Publish.copy(text);
      toast(ok ? '복사했습니다. 붙여넣기만 하시면 됩니다' : '복사에 실패했습니다');
      if (!Publish.open(ch)) toast('열 주소가 없습니다. 채널 설정에서 주소를 넣어주세요');
    };

    el('#copyBtn').onclick = async () => {
      toast(await Publish.copy(text) ? '복사했습니다' : '복사에 실패했습니다');
    };

    const shareBtn = el('#shareBtn');
    if (shareBtn) shareBtn.onclick = async () => {
      const r = await Publish.share(text, Compose.title(p));
      if (r === false) toast('이 기기에서는 공유를 쓸 수 없습니다');
    };

    el('#editBtn').onclick = () => {
      openSheet('이번 게재에만 적용', `
        <textarea class="textarea tall" id="tweak">${esc(text)}</textarea>
        <div class="info">여기서 고친 내용은 이번 채널에만 씁니다.
        늘 이렇게 나오게 하려면 채널 탭 → 문안 템플릿을 고치세요.</div>
        <div class="btn-row"><button class="btn primary" id="tweakOk">적용</button></div>`,
        (root) => {
          root.querySelector('#tweakOk').onclick = () => {
            draftText = root.querySelector('#tweak').value;
            closeSheet();
            render();
          };
        });
    };

    el('#cardBtn').onclick = () => cardSheet(p);

    el('#doneBtn').onclick = () => {
      queue.complete();
      draftText = null;
      render();
      window.scrollTo(0, 0);
    };

    el('#skipBtn').onclick = () => {
      queue.skip();
      draftText = null;
      render();
      window.scrollTo(0, 0);
    };

    const prevBtn = el('#prevBtn');
    if (prevBtn) prevBtn.onclick = () => {
      queue.back();
      draftText = null;
      render();
    };
  };

  function finishView(p) {
    setTop('게재 완료');
    const done = queue.done.map(id => Store.channel(id)).filter(Boolean);

    view.innerHTML = `
      <div class="empty">
        <strong>${done.length}군데 올렸습니다</strong>
        <p>${esc(Compose.title(p))}</p>
      </div>
      ${done.map(c => `
        <div class="row">
          <div class="body">
            <div class="name">${esc(c.name)}</div>
            <div class="meta">${c.bumpDays}일 뒤 다시 올릴 때가 됩니다</div>
          </div>
          <span class="badge-pill b-fresh">완료</span>
        </div>`).join('')}
      <div class="btn-row" style="margin-top:16px">
        <button class="btn primary" id="homeBtn">공고 목록으로</button>
      </div>`;

    view.querySelector('#homeBtn').onclick = () => {
      queue = null; stack = []; tabTo('home');
    };
  }

  /* ─────────── 이미지 카드 ─────────── */

  function cardSheet(p) {
    const theme = Store.settings().cardTheme;
    openSheet('이미지 카드', `
      <div id="cardWrap"></div>
      <div class="chips" id="themeChips">
        ${Card.themeList().map(t => `<span class="chip ${t.id === theme ? 'on' : ''}" data-t="${t.id}">${esc(t.name)}</span>`).join('')}
      </div>
      <div class="btn-row">
        <button class="btn primary" id="cardShare">공유</button>
        <button class="btn" id="cardSave">저장</button>
      </div>
      <div class="info">글이 순식간에 밀려나는 오픈톡·당근에서는 이미지 한 장이 더 오래 남습니다.</div>`,
      (root) => {
        let cur = theme;
        const wrap = root.querySelector('#cardWrap');

        const paint = () => {
          wrap.innerHTML = '';
          wrap.appendChild(Card.draw(p, cur));
          root.querySelectorAll('#themeChips .chip')
              .forEach(c => c.classList.toggle('on', c.dataset.t === cur));
        };

        root.querySelectorAll('#themeChips .chip').forEach(c => {
          c.onclick = () => { cur = c.dataset.t; Store.setSetting('cardTheme', cur); paint(); };
        });

        root.querySelector('#cardSave').onclick = async () => {
          const blob = await Card.toBlob(wrap.querySelector('canvas'));
          Publish.download(`${Compose.title(p)}.png`, blob);
          toast('저장했습니다');
        };

        root.querySelector('#cardShare').onclick = async () => {
          const blob = await Card.toBlob(wrap.querySelector('canvas'));
          const r = await Publish.shareWithImage(Compose.title(p), blob, `${Compose.title(p)}.png`);
          if (r === false) toast('이 기기에서는 공유를 쓸 수 없습니다');
        };

        paint();
      });
  }

  /* ═══════════════ 채널 ═══════════════ */

  VIEWS.channels = () => {
    setTop('채널', '추가', () => channelSheet(null));

    view.innerHTML = `

            <div class="meta">${esc(kind.label)} · ${c.bumpDays}일마다 · ${c.url ? esc(c.url.replace(/^https?:\/\//, '').slice(0, 34)) : '주소 없음'}</div>
          </div>
          <div class="acts">
            <button data-move="-1" ${i === 0 ? 'disabled style="opacity:.25"' : ''} aria-label="위로">▲</button>

          </div>
        </div>`;
      }).join('')}

      <div class="section-label">문안 템플릿</div>
      <div class="info">채널 종류마다 문안이 다르게 만들어집니다. 말투가 마음에 안 들면 여기서 고치세요.</div>
      ${Object.entries(Store.KINDS).map(([k, v]) => `
        <div class="row tap-tpl" data-kind="${k}" style="cursor:pointer">
          <div class="body">
            <div class="name">${esc(v.label)}</div>
            <div class="meta">권장 ${v.limit}자${v.desc ? ' · ' + esc(v.desc) : ''}</div>
          </div>
          <span style="color:var(--faint)">›</span>
        </div>`).join('')}`;

    view.querySelectorAll('.row[data-id]').forEach(row => {
      row.querySelector('.tap-edit').onclick = () => channelSheet(row.dataset.id);
      row.querySelectorAll('[data-move]').forEach(b => {
        b.onclick = (e) => {
          e.stopPropagation();
          Store.moveChannel(row.dataset.id, parseInt(b.dataset.move, 10));
          render();
        };
      });
    });
    view.querySelectorAll('.tap-tpl').forEach(r => {
      r.onclick = () => go('templates', r.dataset.kind);
    });
  };

  function channelSheet(id) {
    const c = id ? Store.channel(id) : { id: '', name: '', kind: 'openchat', url: '', bumpDays: 7, enabled: true };

    openSheet(id ? '채널 고치기' : '채널 추가', `
      <div class="field">
        <label>이름 <span class="hint">오픈톡방은 방 이름을 그대로 쓰면 헷갈리지 않습니다</span></label>
        <input class="input" id="cName" value="${esc(c.name)}" placeholder="예: 수원맘 오픈톡방">
      </div>
      <div class="field">
        <label>종류 <span class="hint">문안 길이와 말투가 여기서 정해집니다</span></label>
        <select class="input" id="cKind">
          ${Object.entries(Store.KINDS).map(([k, v]) =>
            `<option value="${k}" ${c.kind === k ? 'selected' : ''}>${esc(v.label)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>주소 <span class="hint">글쓰기 화면 주소를 넣으면 한 번에 열립니다</span></label>
        <input class="input" id="cUrl" value="${esc(c.url)}" placeholder="https://..." inputmode="url">
      </div>
      <div class="field">
        <label>끌어올리기 주기 <span class="hint">며칠 뒤에 다시 올릴지</span></label>
        <input class="input" id="cBump" type="number" min="1" max="90" value="${c.bumpDays}" inputmode="numeric">
      </div>
      <div class="field">
        <label class="pick ${c.enabled ? 'on' : ''}" id="cEnabled" style="margin:0">
          <span class="box"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="body"><span class="name">이 채널 사용</span>
          <span class="meta">끄면 게재 목록에 나오지 않습니다</span></span>
        </label>
      </div>

      <div class="btn-row"><button class="btn primary" id="cSave">저장</button></div>
      ${id ? `<div class="btn-row"><button class="btn ghost danger" id="cDel">이 채널 삭제</button></div>` : ''}

      <div class="info">

        방 목록에서 직접 고르셔야 합니다 — 카카오는 외부에서 특정 방으로 메시지를 보내는 길을 열어두지 않았습니다.
      </div>`,
      (root) => {
        let on = c.enabled;
        const box = root.querySelector('#cEnabled');
        box.onclick = (e) => { e.preventDefault(); on = !on; box.classList.toggle('on', on); };

        root.querySelector('#cSave').onclick = () => {
          const name = root.querySelector('#cName').value.trim();
          if (!name) { toast('이름을 적어주세요'); return; }
          Store.upsertChannel({
            id: c.id,
            name,
            kind: root.querySelector('#cKind').value,
            url: root.querySelector('#cUrl').value.trim(),
            bumpDays: Math.max(1, parseInt(root.querySelector('#cBump').value, 10) || 7),
            enabled: on,
            template: c.template,
            order: c.order,

          closeSheet();
          render();
          toast('저장했습니다');

        if (del) del.onclick = () => {

          Store.removeChannel(c.id);
          closeSheet();
          render();
        };
      });
  }

  /* ═══════════════ 문안 템플릿 ═══════════════ */

  VIEWS.templates = (kind) => {
    const k = Store.KINDS[kind] ? kind : 'etc';
    const info = Store.KINDS[k];

    setTop(`${info.label} 문안`, '저장', save);

    view.innerHTML = `
      <div class="info">
        <b>{{항목}}</b> 자리에 공고 내용이 들어갑니다.<br>
        내용이 비어 있는 항목이 들어간 <b>줄은 통째로 사라집니다</b> — 빈칸을 남겨도 문안이 깨지지 않습니다.
      </div>

      </div>

        <textarea class="textarea tall" id="tpl">${esc(Store.templates()[k])}</textarea>
      </div>

      <div class="section-label">미리보기</div>

      </div>`;

    view.querySelectorAll('#tokenChips .chip').forEach(c => {
      c.onclick = () => {
        const t = `{{${c.dataset.t}}}`;

        ta.selectionStart = ta.selectionEnd = s + t.length;
        ta.focus();
        repaint();
      };

    }

    view.querySelector('#saveBtn').onclick = save;
    view.querySelector('#resetBtn').onclick = () => {
      if (!confirm('이 종류의 문안을 처음 상태로 되돌립니다.')) return;
      Store.resetTemplate(k);
      render();

    repaint();
  };

      </div>
      <div class="btn-row">
        <button class="btn ghost danger" id="wipeBtn">전부 지우기</button>
      </div>
      <input type="file" id="impFile" accept="application/json,.json" class="hidden">

      <div class="section-label">게재 기록</div>
      ${nLog ? Store.logs().slice(0, 20).map(l => {
        const p = Store.posting(l.postingId), c = Store.channel(l.channelId);
        if (!p || !c) return '';
        return `<div class="row"><div class="body">
          <div class="name">${esc(c.name)}</div>
          <div class="meta">${esc(Compose.title(p))} · ${when(l.at)}</div>
        </div></div>`;
      }).join('') : '<div class="info">아직 기록이 없습니다.</div>'}`;

    view.querySelectorAll('#themeChips .chip').forEach(c => {
      c.onclick = () => { Store.setSetting('cardTheme', c.dataset.t); render(); };
    });

    view.querySelector('#expBtn').onclick = () => {
      const d = new Date();
      const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
      Publish.download(`구인캐스터-백업-${stamp}.json`, Store.exportJSON(), 'application/json');
      toast('내보냈습니다');
    };

    const file = view.querySelector('#impFile');
    view.querySelector('#impBtn').onclick = () => file.click();
    file.onchange = () => {
      const f = file.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          if (!confirm('지금 들어있는 내용을 파일 내용으로 덮어씁니다. 계속할까요?')) return;
          Store.importJSON(r.result);
          stack = [];
          tabTo('home');
          toast('가져왔습니다');
        } catch (e) {
          alert('읽지 못했습니다 — ' + e.message);
        }
      };
      r.readAsText(f);
      file.value = '';
    };

    view.querySelector('#wipeBtn').onclick = () => {
      if (!confirm('공고·채널·기록을 전부 지웁니다. 되돌릴 수 없습니다.')) return;
      if (!confirm('정말 지울까요? 내보내기를 먼저 해두시는 걸 권합니다.')) return;
      Store.wipe();
      stack = [];
      tabTo('home');
    };
  };

  /* ─────────── 시작 ─────────── */

  function start() {
    backBtn.onclick = back;
    document.getElementById('sheetScrim').onclick = closeSheet;
    document.getElementById('sheetClose').onclick = closeSheet;
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { sheet.classList.contains('hidden') ? back() : closeSheet(); }
    });
    tabbar.querySelectorAll('.tab').forEach(b => {
      b.onclick = () => tabTo(b.dataset.tab);
    });
    render();
  }

  return { start, go, back, tabTo, toast, render, closeSheet, get stackDepth() { return stack.length; }, get sheetOpen() { return !sheet.classList.contains('hidden'); } };

})();

</script>
<script>
/* app.js — 부팅 · 뒤로가기 */

(function () {

  document.addEventListener('DOMContentLoaded', () => {
    UI.start();
    hookBack();
    hookCapacitor();
  });

  /* 브라우저·안드로이드 뒤로가기를 앱 안 뒤로가기로 씁니다.
   * 히스토리에 자리를 하나 잡아두고, 뒤로 갈 때마다 다시 채워 넣습니다. */
  function hookBack() {
    history.replaceState({ app: true }, '');
    history.pushState({ app: true }, '');

    window.addEventListener('popstate', () => {
      history.pushState({ app: true }, '');
      if (UI.sheetOpen) { UI.closeSheet(); return; }
      if (UI.stackDepth) { UI.back(); return; }
      // 더 갈 데가 없으면 그냥 둡니다 — 브라우저에서는 여기서 멈춥니다.
    });
  }

  /* Capacitor 로 감쌌을 때만 동작합니다. 웹에서는 조용히 넘어갑니다. */
  function hookCapacitor() {
    const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
    if (!App) return;
    App.addListener('backButton', () => {
      if (UI.sheetOpen) { UI.closeSheet(); return; }
      if (UI.stackDepth) { UI.back(); return; }
      App.exitApp();
    });
  }

})();

</script>
